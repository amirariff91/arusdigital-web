# Arus Digital — static site served by nginx.
# Canonical: apex host, no www, no trailing slash (matches astro.config.mjs).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json image/svg+xml application/xml application/manifest+json;

    # ---- legacy URL redirects (old hand-built site) ----
    location = /index.html { return 301 /; }
    location = /about.html { return 301 /about; }

    # ---- strip trailing slashes (canonical = no trailing slash) ----
    # /about/ -> /about ; leaves "/" untouched.
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    # ---- hashed build assets — long, immutable cache ----
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ---- static files (images, fonts, og, favicon) ----
    location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- pages — HTML, no cache so deploys are seen immediately ----
    # build.format: 'directory' => /about resolves to /about/index.html
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html $uri.html =404;
    }

    # ---- custom 404 ----
    error_page 404 /404.html;
    location = /404.html { internal; }

    # ---- light security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
